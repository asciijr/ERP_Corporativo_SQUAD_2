name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  branch-guard:
    name: Branch Guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch for main
        if: github.base_ref == 'main'
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          if [[ "$SOURCE_BRANCH" != "develop" && ! "$SOURCE_BRANCH" =~ ^(release|hotfix)/.+ ]]; then
            echo "❌ ERRO: Pull Requests para 'main' só são permitidos a partir de 'develop', 'release/*' ou 'hotfix/*'. Branch atual: '$SOURCE_BRANCH'."
            exit 1
          fi
          echo "✅ Branch de origem válida para 'main': $SOURCE_BRANCH"

      - name: Validate source branch for develop
        if: github.base_ref == 'develop'
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          if [[ ! "$SOURCE_BRANCH" =~ ^(feat|fix|chore|docs|refactor|style|test|ci)/.+ ]]; then
            echo "❌ ERRO: Pull Requests para 'develop' devem vir de branches no formato '<tipo>/<descricao>'. Branch atual: '$SOURCE_BRANCH'."
            exit 1
          fi
          echo "✅ Branch de origem válida para 'develop': $SOURCE_BRANCH"

  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    needs: branch-guard
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  backend-node:
    name: Backend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    needs: branch-guard
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Production Build
    runs-on: ubuntu-latest
    needs: [frontend, backend-node]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Production Image
        run: docker build --target prod -t erp-backend ./backend

      - name: Build Frontend Production Image
        run: docker build --target prod -t erp-frontend ./frontend
